<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/styles.css?v=20260419p' | relative_url }}">
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      },
      svg: {
        fontCache: 'global'
      }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  <script defer data-prefix="busuanzi_value" src="https://jsd.dusays.com/npm/penndu@17.0.0/bsz.js"></script>
  <script>
    (() => {
      // Add the legacy totals as a display baseline without double-counting our own DOM update.
      const legacyBase = Object.freeze({ site_uv: 278, site_pv: 2796 });
      const lastRenderedValue = new WeakMap();

      const applyLegacyBase = () => {
        Object.entries(legacyBase).forEach(([key, base]) => {
          const target = document.getElementById(`busuanzi_value_${key}`);
          if (!target) return;

          const raw = target.textContent.trim();
          if (raw === lastRenderedValue.get(target)) return;

          const current = Number.parseInt(raw.replace(/,/g, ''), 10);
          if (!Number.isFinite(current)) return;

          const rendered = String(current + base);
          lastRenderedValue.set(target, rendered);
          if (raw !== rendered) target.textContent = rendered;
        });
      };

      const observer = new MutationObserver(applyLegacyBase);
      observer.observe(document.documentElement, { childList: true, subtree: true, characterData: true });
      applyLegacyBase();
      window.setTimeout(() => observer.disconnect(), 10000);
    })();
  </script>
</head>
<body class="{% if page.hero_background or page.cover_image %}has-immersive-hero{% endif %}">
  <div class="site-shell">
    <header class="topbar{% if page.hero_background or page.cover_image %} topbar-immersive{% endif %}">
      <div class="topbar-inner">
        <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <nav class="topnav" aria-label="主导航">
          <a class="nav-link {% if page.nav == 'home' %}is-active{% endif %}" href="{{ '/' | relative_url }}">
            <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.2 2.4 10.8l1.2 1.5L5 11.2V20h5v-5h4v5h5v-8.8l1.4 1.1 1.2-1.5z"/></svg></span>
            <span>首页</span>
          </a>
          <a class="nav-link {% if page.nav == 'archive' %}is-active{% endif %}" href="{{ '/blog/index.html' | relative_url }}">
            <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h16v4H4zm1 6h14v10H5zm3 2v2h8v-2z"/></svg></span>
            <span>分类</span>
          </a>
          <a class="nav-link {% if page.nav == 'categories' %}is-active{% endif %}" href="{{ '/categories/index.html' | relative_url }}">
            <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h7v7H4zm9 0h7v7h-7zM4 13h7v7H4zm9 0h7v7h-7z"/></svg></span>
            <span>合集</span>
          </a>
          <a class="nav-link {% if page.nav == 'tags' %}is-active{% endif %}" href="{{ '/tags/index.html' | relative_url }}">
            <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M10.6 3H4v6.6L13.4 19 20 12.4zM7.5 8A1.5 1.5 0 1 1 9 6.5 1.5 1.5 0 0 1 7.5 8"/></svg></span>
            <span>标签</span>
          </a>
          <a class="nav-link {% if page.nav == 'about' %}is-active{% endif %}" href="{{ '/about/index.html' | relative_url }}">
            <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4m0 2c-4.4 0-8 2.2-8 5v1h16v-1c0-2.8-3.6-5-8-5"/></svg></span>
            <span>关于</span>
          </a>
          <button class="nav-link nav-link-icon search-trigger" type="button" aria-label="搜索" aria-haspopup="dialog" aria-controls="search-modal">
            <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 4a6 6 0 1 0 3.9 10.6l4.7 4.7 1.4-1.4-4.7-4.7A6 6 0 0 0 10 4m0 2a4 4 0 1 1-4 4 4 4 0 0 1 4-4"/></svg></span>
          </button>
        </nav>
      </div>
    </header>

    <main class="page-layout">
      {{ content }}
    </main>
  </div>
  <div id="search-modal" class="search-modal" hidden>
    <div class="search-backdrop" data-close-search="true"></div>
    <div class="search-dialog" role="dialog" aria-modal="true" aria-labelledby="search-modal-title">
      <div class="search-dialog-header">
        <h2 id="search-modal-title">搜索</h2>
        <button class="search-close" type="button" aria-label="关闭搜索" data-close-search="true">
          <span aria-hidden="true">×</span>
        </button>
      </div>
      <label class="search-label" for="global-search-input">搜索标题、标签、分类或摘要</label>
      <input id="global-search-input" class="search-input" type="search" placeholder="输入关键词..." autocomplete="off">
      <div id="global-search-results" class="search-results" role="status" aria-live="polite" aria-atomic="true"></div>
    </div>
  </div>
  {% if page.hero_background or page.cover_image %}
  <script>
    (() => {
      const topbar = document.querySelector('.topbar-immersive');
      const hero = document.querySelector('.home-hero, .post-hero');
      if (!topbar || !hero) return;

      const syncTopbarHeight = () => {
        document.documentElement.style.setProperty('--topbar-height', `${topbar.offsetHeight}px`);
      };

      const syncTopbar = () => {
        const heroBottom = hero.getBoundingClientRect().bottom;
        const threshold = topbar.offsetHeight;
        topbar.classList.toggle('is-scrolled', heroBottom <= threshold);
      };

      syncTopbarHeight();
      syncTopbar();
      window.addEventListener('scroll', syncTopbar, { passive: true });
      window.addEventListener('resize', () => {
        syncTopbarHeight();
        syncTopbar();
      });
    })();
  </script>
  {% endif %}
  <script>
    (() => {
      const topbar = document.querySelector('.topbar');
      if (!topbar) return;

      const syncTopbarHeight = () => {
        document.documentElement.style.setProperty('--topbar-height', `${topbar.offsetHeight}px`);
      };

      syncTopbarHeight();
      window.addEventListener('resize', syncTopbarHeight);
    })();
  </script>
  <script>
    (() => {
      const modal = document.getElementById('search-modal');
      const input = document.getElementById('global-search-input');
      const results = document.getElementById('global-search-results');
      const trigger = document.querySelector('.search-trigger');
      const closeButton = modal?.querySelector('.search-close');
      const dialog = modal?.querySelector('.search-dialog');
      if (!modal || !input || !results || !trigger || !closeButton || !dialog) return;

      let items = [];
      let loaded = false;
      let loading = false;

      const render = (matches, query) => {
        if (!query) {
          results.innerHTML = '<p class="search-empty">请输入关键词以搜索文章和页面。</p>';
          return;
        }
        if (!matches.length) {
          results.innerHTML = '<p class="search-empty">未找到匹配内容。</p>';
          return;
        }

        results.innerHTML = matches.slice(0, 12).map(item => `
          <a class="search-result-card" href="${item.url}">
            <strong>${item.title}</strong>
            <span>${item.kind}</span>
            <p>${item.meta}</p>
          </a>
        `).join('');
      };

      const loadIndex = () => {
        if (loaded || loading) return;
        loading = true;
        results.innerHTML = '<p class="search-empty" role="status">正在加载搜索内容…</p>';
        fetch('{{ "/search.json" | relative_url }}')
          .then(res => {
            if (!res.ok) throw new Error('Search index request failed');
            return res.json();
          })
          .then(data => {
            if (!Array.isArray(data)) throw new Error('Search index is invalid');
            items = data;
            loaded = true;
            const query = input.value.trim().toLowerCase();
            const matches = items.filter(item =>
              item.title.toLowerCase().includes(query) ||
              item.meta.toLowerCase().includes(query) ||
              item.excerpt.toLowerCase().includes(query)
            );
            render(matches, query);
          })
          .catch(() => {
            results.innerHTML = '<p class="search-empty" role="alert">搜索内容加载失败。<button class="search-retry" type="button">重试</button></p>';
            results.querySelector('.search-retry')?.addEventListener('click', loadIndex, { once: true });
          })
          .finally(() => { loading = false; });
      };

      const getFocusable = () => Array.from(dialog.querySelectorAll('a[href], button:not(:disabled), input:not(:disabled), [tabindex]:not([tabindex="-1"])'))
        .filter(element => element.getClientRects().length > 0);

      const openSearch = () => {
        modal.hidden = false;
        document.body.classList.add('search-open');
        loadIndex();
        if (loaded) render([], '');
        input.value = '';
        requestAnimationFrame(() => input.focus());
      };

      const closeSearch = () => {
        modal.hidden = true;
        document.body.classList.remove('search-open');
        trigger.focus();
      };

      trigger.addEventListener('click', openSearch);
      modal.addEventListener('click', event => {
        if (event.target.closest('[data-close-search="true"]')) closeSearch();
      });
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape' && !modal.hidden) closeSearch();
        if (event.key === 'Tab' && !modal.hidden) {
          const focusable = getFocusable();
          const first = focusable[0];
          const last = focusable[focusable.length - 1];
          if (!first || !last) return;
          if (event.shiftKey && (document.activeElement === first || !dialog.contains(document.activeElement))) {
            event.preventDefault();
            last.focus();
          } else if (!event.shiftKey && (document.activeElement === last || !dialog.contains(document.activeElement))) {
            event.preventDefault();
            first.focus();
          }
        }
      });
      input.addEventListener('input', () => {
        const query = input.value.trim().toLowerCase();
        if (!loaded) {
          results.innerHTML = '<p class="search-empty" role="status">正在加载搜索内容…</p>';
          return;
        }
        const matches = items.filter(item =>
          item.title.toLowerCase().includes(query) ||
          item.meta.toLowerCase().includes(query) ||
          item.excerpt.toLowerCase().includes(query)
        );
        render(matches, query);
      });
    })();
  </script>
</body>
</html>
